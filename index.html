<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мои альбомы — Фотобот</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F8FA; --surface: #FFFFFF; --surface2: #F9FAFB;
  --border: #E5E7EB; --border2: #D1D5DB;
  --accent: #635BFF; --accent2: #7A73FF; --accent-light: #ECECFD;
  --text: #1A1F36; --text2: #3C4257;
  --muted: #697386; --muted2: #A3ACB9;
  --green: #09825D; --green-light: #CBFFE3;
  --red: #C0123C; --red-light: #FFE8EF;
  --blue: #1A56DB; --blue-light: #E1EFFE;
  --topbar-bg: #0B1020; --sidebar-bg: #1A1D2E;
  --bottom-nav-h: 64px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg); color: var(--text);
  font-family: 'Montserrat', sans-serif; font-size: 14px;
  -webkit-text-size-adjust: 100%;
}
body { padding-bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom)); }

/* ─── TOPBAR ─── */
.topbar {
  background: var(--topbar-bg); height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-left));
  position: sticky; top: 0; z-index: 100;
  border-bottom: 1px solid rgba(123,97,255,0.2);
}
.topbar-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
.topbar-logo-text { font-family: 'Unbounded', sans-serif; font-size: 0.82rem; font-weight: 700; color: #fff; letter-spacing: 0.08em; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.balance-chip { background: rgba(99,91,255,0.2); border: 1.5px solid rgba(99,91,255,0.4); border-radius: 20px; padding: 5px 12px; font-size: 0.72rem; font-weight: 700; color: #C7C4FF; }
.burger-btn { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
.burger-btn span { display: block; width: 18px; height: 2px; background: #fff; border-radius: 1px; }

/* ─── DRAWER ─── */
.drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(2px); }
.drawer-overlay.open { opacity: 1; pointer-events: all; }
.drawer { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: var(--sidebar-bg); z-index: 201; transition: right 0.3s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; }
.drawer.open { right: 0; }
.drawer-head { padding: 18px 16px; background: #13152A; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.drawer-close { width: 30px; height: 30px; border-radius: 7px; background: rgba(255,255,255,0.08); border: none; color: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; }
.drawer-nav { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.d-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; color: rgba(160,168,192,0.8); text-decoration: none; font-size: 0.82rem; font-weight: 500; }
.d-item:active { background: rgba(123,97,255,0.15); color: #fff; }
.d-item.active { background: rgba(123,97,255,0.15); color: #fff; border: 1px solid rgba(123,97,255,0.2); }
.d-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; }
.d-item.active .d-icon { opacity: 1; color: var(--accent2); }
.d-badge { margin-left: auto; background: var(--red); color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 0.65rem; font-weight: 700; }
.d-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 6px 10px; }
.drawer-bottom { padding: 10px; flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.06); }
.d-item.ai { background: rgba(99,91,255,0.1); color: rgba(255,255,255,0.85); border: 1px solid rgba(99,91,255,0.2); margin-bottom: 4px; position: relative; }
.ai-pulse-d { position: absolute; top: 10px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 5px rgba(74,222,128,0.6); animation: blink 1.5s infinite; }
.d-item.instr { background: rgba(16,185,129,0.1); color: #6EE7B7; border: 1px solid rgba(16,185,129,0.15); margin-bottom: 4px; }
.d-item.logout { color: rgba(255,255,255,0.25); }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

/* ─── PAGE ─── */
.page { padding: 16px; }

/* ─── PAGE HEADER ─── */
.page-header { margin-bottom: 16px; }
.page-title { font-family: 'Unbounded', sans-serif; font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.page-sub { font-size: 0.75rem; color: var(--muted); line-height: 1.5; }

/* ─── ORDER CARD ─── */
.order-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  margin-bottom: 12px;
  animation: fadeUp 0.3s ease;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:none;} }

/* Card top accent line */
.card-accent { height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

.card-body { padding: 16px; }

/* Status row */
.card-status-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.order-id { font-family: 'Unbounded', sans-serif; font-size: 0.78rem; font-weight: 700; color: var(--muted2); }

.status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 0.68rem; font-weight: 700; }
.status-badge.new      { background: var(--blue-light); color: var(--blue); }
.status-badge.shooting { background: var(--accent-light); color: var(--accent); }
.status-badge.review   { background: #FEF3C7; color: #B35309; }
.status-badge.done     { background: var(--green-light); color: var(--green); }
.status-badge.fix      { background: var(--red-light); color: var(--red); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1.5s infinite; }

/* Info grid */
.card-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-bottom: 18px; }
.info-item { display: flex; flex-direction: column; gap: 3px; }
.info-label { font-size: 0.62rem; font-weight: 700; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.06em; }
.info-value { font-size: 0.82rem; font-weight: 600; color: var(--text); }

/* Action buttons */
.card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn-album {
  height: 46px; border: none; border-radius: 11px;
  background: var(--green); color: #fff;
  font-family: 'Montserrat', sans-serif; font-size: 0.8rem; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
  box-shadow: 0 3px 12px rgba(9,130,93,0.3);
  transition: all 0.15s;
}
.btn-album:active { background: #076b4d; transform: scale(0.97); }

.btn-photos {
  height: 46px; border-radius: 11px;
  border: 2px solid var(--blue); background: transparent; color: var(--blue);
  font-family: 'Montserrat', sans-serif; font-size: 0.8rem; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: all 0.15s;
}
.btn-photos:active { background: var(--blue); color: #fff; transform: scale(0.97); }

/* ─── EMPTY STATE ─── */
.empty-state {
  text-align: center; padding: 48px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.empty-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-light); display: flex; align-items: center; justify-content: center; color: var(--accent); }
.empty-title { font-family: 'Unbounded', sans-serif; font-size: 0.88rem; font-weight: 700; color: var(--text); }
.empty-sub { font-size: 0.78rem; color: var(--muted); line-height: 1.6; }

/* ─── BOTTOM NAV ─── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--bottom-nav-h);
  background: var(--topbar-bg);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: stretch; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; position: relative; text-decoration: none; }
.nav-icon { width: 22px; height: 22px; color: rgba(160,168,192,0.5); transition: color 0.18s; }
.nav-label { font-size: 0.58rem; font-weight: 500; color: rgba(160,168,192,0.5); letter-spacing: 0.03em; }
.nav-item.active .nav-icon { color: var(--accent2); }
.nav-item.active .nav-label { color: var(--accent2); font-weight: 600; }
.nav-item.active::after { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 28px; height: 2px; background: var(--accent); border-radius: 0 0 2px 2px; }
.nav-badge { position: absolute; top: 6px; right: calc(50% - 18px); background: var(--red); color: #fff; border-radius: 10px; padding: 1px 5px; font-size: 0.55rem; font-weight: 700; border: 1.5px solid var(--topbar-bg); }

/* ─── TOAST ─── */
.toast-wrap { position: fixed; bottom: calc(var(--bottom-nav-h) + 10px); left: 14px; right: 14px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: #1A1F36; color: #fff; border-radius: 10px; padding: 11px 14px; font-size: 0.8rem; font-family: 'Montserrat', sans-serif; font-weight: 500; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); animation: tIn 0.28s ease; pointer-events: all; }
@keyframes tIn  { from{opacity:0;transform:translateY(8px);}  to{opacity:1;transform:none;} }
@keyframes tOut { from{opacity:1;} to{opacity:0;transform:translateY(8px);} }
.t-icon { width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.t-icon.green { background: var(--green-light); color: var(--green); }
.t-icon.blue  { background: var(--blue-light); color: var(--blue); }

/* ─── BREAKPOINTS ─── */
@media (max-width: 374px) {
  .page { padding: 12px; }
  .page-title { font-size: 0.9rem; }
  .btn-album, .btn-photos { height: 42px; font-size: 0.74rem; }
  .card-body { padding: 14px; }
}
@media (min-width: 430px) {
  .page { padding: 20px; }
  .card-body { padding: 20px; }
  .btn-album, .btn-photos { height: 50px; font-size: 0.84rem; }
}
@media (max-height: 500px) and (orientation: landscape) {
  .topbar { height: 44px; }
  .card-info { grid-template-columns: repeat(4, 1fr); }
  .card-actions { grid-template-columns: 1fr 1fr; }
  body { padding-bottom: 56px; }
  .bottom-nav { height: 56px; }
}
@media (min-width: 600px) {
  .page { max-width: 560px; margin: 0 auto; padding: 24px 20px; }
}
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <a href="#" class="topbar-logo">
    <svg width="22" height="19" viewBox="0 0 265 233" fill="none">
      <path d="M0 0 C0 73.26 0 146.52 0 222 C-6.2 220.62 -12.03 219.13 -18.01 217.11 C-28.91 213.46 -53.06 205.38 -96 191 C-96 138.2 -96 85.4 -96 31 C-49.69 15.5 -29.17 8.63 0 0 Z" fill="#fff" transform="translate(259,6)"/>
      <path d="M0 0 C0 73.26 0 146.52 0 222 C-10.88 218.24 -22.01 212.65 -48.47 199.37 C-57.64 194.76 -64 191 -64 191 C-64 138.2 -64 85.4 -64 31 C-34.06 15.43 -17.27 6.98 0 0 Z" fill="#fff" transform="translate(132,6)"/>
      <path d="M0 0 C0 73.26 0 146.52 0 222 C-14 215 -26.78 205.93 -33 191 C-39.09 168.15 -36.93 100.1 -21.74 14.45 C-6.49 0 0 0 0 0 Z" fill="#fff" transform="translate(37,6)"/>
    </svg>
    <span class="topbar-logo-text">ФОТОБОТ</span>
  </a>
  <div class="topbar-right">
    <div class="balance-chip">₽ 2 748.41</div>
    <div class="burger-btn" onclick="openDrawer()"><span></span><span></span><span></span></div>
  </div>
</header>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <span style="font-family:'Unbounded',sans-serif;font-size:0.8rem;font-weight:700;color:#fff;letter-spacing:0.06em;">ФОТОБОТ</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <nav class="drawer-nav">
    <a href="#" class="d-item active">
      <svg class="d-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      Альбомы со мной
    </a>
    <div class="d-divider"></div>
    <a href="#" class="d-item">
      <svg class="d-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Профиль
    </a>
    <a href="#" class="d-item">
      <svg class="d-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      Уведомления
      <span class="d-badge">4</span>
    </a>
  </nav>
  <div class="drawer-bottom">
    <a href="#" class="d-item ai">
      <div class="ai-pulse-d"></div>
      <svg class="d-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a2 2 0 012 2v1a7 7 0 010 14v1a2 2 0 01-4 0v-1a7 7 0 010-14V4a2 2 0 012-2z"/><circle cx="12" cy="12" r="3"/></svg>
      Помощь 24/7
    </a>
    <a href="#" class="d-item instr">
      <svg class="d-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      Инструкция
    </a>
    <a href="#" class="d-item logout">
      <svg class="d-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Выход
    </a>
  </div>
</div>

<!-- PAGE -->
<div class="page">

  <div class="page-header">
    <div class="page-title">Мои альбомы</div>
    <div class="page-sub">Просматривайте макеты и выбирайте фотографии</div>
  </div>

  <!-- ORDER CARD -->
  <div class="order-card">
    <div class="card-accent"></div>
    <div class="card-body">

      <div class="card-status-row">
        <div class="order-id"># 3395</div>
        <span class="status-badge new"><span class="status-dot"></span>Новый</span>
      </div>

      <div class="card-info">
        <div class="info-item">
          <div class="info-label">Город</div>
          <div class="info-value">Нижний Новгород</div>
        </div>
        <div class="info-item">
          <div class="info-label">Класс / Группа</div>
          <div class="info-value">11А</div>
        </div>
        <div class="info-item">
          <div class="info-label">Школа</div>
          <div class="info-value">Школа №1999</div>
        </div>
        <div class="info-item">
          <div class="info-label">Создан</div>
          <div class="info-value">29.01.2026</div>
        </div>
      </div>

      <div class="card-actions">
        <button class="btn-album" onclick="openAlbum()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
          Альбом
        </button>
        <button class="btn-photos" onclick="openPhotos()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Фотографии
        </button>
      </div>

    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="#" class="nav-item active">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
    <span class="nav-label">Альбомы</span>
  </a>
  <a href="#" class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span class="nav-label">Профиль</span>
  </a>
  <a href="#" class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    <span class="nav-label">Уведомл.</span>
    <span class="nav-badge">4</span>
  </a>
  <a href="#" class="nav-item" onclick="openDrawer()">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    <span class="nav-label">Ещё</span>
  </a>
</nav>

<div class="toast-wrap" id="twrap"></div>

<script>
function openAlbum() { toast('Открываем просмотр альбома…', 'green'); }
function openPhotos() { toast('Открываем выбор фотографий…', 'blue'); }

function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function toast(msg, type='green') {
  const icons = {
    green: '<polyline points="20 6 9 17 4 12"/>',
    blue:  '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>'
  };
  const w = document.getElementById('twrap');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<div class="t-icon ${type}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">${icons[type]}</svg></div><span>${msg}</span>`;
  w.appendChild(t);
  setTimeout(() => { t.style.animation = 'tOut .28s ease forwards'; setTimeout(() => t.remove(), 280); }, 3000);
}
</script>
</body>
</html>
